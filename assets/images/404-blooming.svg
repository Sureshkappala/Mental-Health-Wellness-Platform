<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="errBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#F2EDE4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#errBg)"/>
  <!-- Gentle Pot with blooming plant resting -->
  <g transform="translate(400, 260)">
    <circle cx="0" cy="0" r="140" fill="#EAF3EE" opacity="0.6"/>
    <!-- Pot -->
    <path d="M-40,60 L40,60 L30,120 L-30,120 Z" fill="#E89A7A"/>
    <!-- Stem and drooping then rising leaves -->
    <path d="M0,60 Q-20,0 0,-50 Q20,0 0,60" fill="none" stroke="#5E8271" stroke-width="6"/>
    <!-- Resting flower bud -->
    <circle cx="0" cy="-55" r="24" fill="#B8A9C9"/>
    <circle cx="0" cy="-55" r="14" fill="#FAF8F5"/>
    <!-- Gentle Zzz -->
    <text x="35" y="-80" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" fill="#5E8271">z</text>
    <text x="50" y="-100" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" fill="#5E8271">z</text>
    <text x="70" y="-125" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" fill="#5E8271">Z</text>
  </g>
</svg>