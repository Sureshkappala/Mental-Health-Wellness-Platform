<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="zenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E6EFE9"/>
      <stop offset="60%" stop-color="#F2EFE8"/>
      <stop offset="100%" stop-color="#E2DDD5"/>
    </linearGradient>
    <radialGradient id="waterRipple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8BB3A3" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#7C9D8E" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7C9D8E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" rx="24" fill="url(#zenGrad)"/>
  
  <!-- Calming Zen Pebbles Stack (Balance) -->
  <g transform="translate(400, 310)">
    <!-- Concentric Sand / Water Circles -->
    <ellipse cx="0" cy="180" rx="320" ry="60" fill="none" stroke="#C8D8CE" stroke-width="2" opacity="0.8"/>
    <ellipse cx="0" cy="180" rx="240" ry="45" fill="none" stroke="#C8D8CE" stroke-width="2" opacity="0.6"/>
    <ellipse cx="0" cy="180" rx="160" ry="30" fill="none" stroke="#C8D8CE" stroke-width="2" opacity="0.4"/>

    <!-- Bottom Pebble -->
    <ellipse cx="0" cy="160" rx="130" ry="42" fill="#4A6E62"/>
    <ellipse cx="-15" cy="155" rx="110" ry="30" fill="#5F887A"/>

    <!-- 2nd Pebble -->
    <ellipse cx="5" cy="100" rx="95" ry="32" fill="#6B887B"/>
    <ellipse cx="-8" cy="95" rx="80" ry="24" fill="#7E9F90"/>

    <!-- 3rd Pebble -->
    <ellipse cx="-5" cy="50" rx="68" ry="24" fill="#889895"/>
    <ellipse cx="-12" cy="46" rx="55" ry="18" fill="#9FB2AE"/>

    <!-- Top Pebble -->
    <ellipse cx="2" cy="10" rx="42" ry="16" fill="#A89EAF"/>
    <ellipse cx="-3" cy="8" rx="34" ry="12" fill="#BDB3C4"/>

    <!-- Single Lotus Flower on the side -->
    <g transform="translate(170, 130) scale(0.7)">
      <path d="M0,0 C-30,-20 -40,-60 0,-80 C40,-60 30,-20 0,0 Z" fill="#FCE5D8"/>
      <path d="M-15,0 C-45,-15 -60,-45 -30,-65 C-10,-45 -5,-15 -15,0 Z" fill="#F5C4B0"/>
      <path d="M15,0 C45,-15 60,-45 30,-65 C10,-45 5,-15 15,0 Z" fill="#F5C4B0"/>
      <circle cx="0" cy="-35" r="8" fill="#F4A261"/>
    </g>
  </g>

  <!-- Gentle Bamboo silhouette in background -->
  <g transform="translate(60, 40)" opacity="0.35" stroke="#4A6E62">
    <line x1="40" y1="0" x2="40" y2="450" stroke-width="8"/>
    <line x1="36" y1="120" x2="44" y2="120" stroke-width="12"/>
    <line x1="36" y1="240" x2="44" y2="240" stroke-width="12"/>
    <line x1="36" y1="360" x2="44" y2="360" stroke-width="12"/>
    <path d="M40,120 Q10,100 0,70" fill="none" stroke-width="4"/>
    <path d="M40,240 Q70,220 90,190" fill="none" stroke-width="4"/>
  </g>
</svg>