<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="commGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBF8F5"/>
      <stop offset="50%" stop-color="#F2EDE4"/>
      <stop offset="100%" stop-color="#E8EFEA"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="24" fill="url(#commGrad)"/>

  <!-- Circular Supportive Circle -->
  <g transform="translate(400, 300)">
    <circle cx="0" cy="0" r="190" fill="none" stroke="#D3DFD8" stroke-width="3" stroke-dasharray="8,8"/>
    
    <!-- Center symbol: Connected hands / blooming heart -->
    <circle cx="0" cy="0" r="70" fill="#FAF8F5" stroke="#7C9D8E" stroke-width="3"/>
    <path d="M0,-20 C0,-40 -30,-40 -30,-15 C-30,10 0,30 0,30 C0,30 30,10 30,-15 C30,-40 0,-40 0,-20 Z" fill="#E89A7A"/>

    <!-- Avatar 1 (Top) -->
    <g transform="translate(0, -190)">
      <circle cx="0" cy="0" r="38" fill="#7C9D8E"/>
      <circle cx="0" cy="-6" r="14" fill="#FAF8F5"/>
      <path d="M-22,22 C-22,6 22,6 22,22 Z" fill="#FAF8F5"/>
    </g>
    <!-- Avatar 2 (Top Right) -->
    <g transform="translate(165, -95)">
      <circle cx="0" cy="0" r="38" fill="#B8A9C9"/>
      <circle cx="0" cy="-6" r="14" fill="#FAF8F5"/>
      <path d="M-22,22 C-22,6 22,6 22,22 Z" fill="#FAF8F5"/>
    </g>
    <!-- Avatar 3 (Bottom Right) -->
    <g transform="translate(165, 95)">
      <circle cx="0" cy="0" r="38" fill="#4A7C7A"/>
      <circle cx="0" cy="-6" r="14" fill="#FAF8F5"/>
      <path d="M-22,22 C-22,6 22,6 22,22 Z" fill="#FAF8F5"/>
    </g>
    <!-- Avatar 4 (Bottom) -->
    <g transform="translate(0, 190)">
      <circle cx="0" cy="0" r="38" fill="#F4A261"/>
      <circle cx="0" cy="-6" r="14" fill="#FAF8F5"/>
      <path d="M-22,22 C-22,6 22,6 22,22 Z" fill="#FAF8F5"/>
    </g>
    <!-- Avatar 5 (Bottom Left) -->
    <g transform="translate(-165, 95)">
      <circle cx="0" cy="0" r="38" fill="#88A89A"/>
      <circle cx="0" cy="-6" r="14" fill="#FAF8F5"/>
      <path d="M-22,22 C-22,6 22,6 22,22 Z" fill="#FAF8F5"/>
    </g>
    <!-- Avatar 6 (Top Left) -->
