<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="deskBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBF8F3"/>
      <stop offset="100%" stop-color="#EFE8DC"/>
    </linearGradient>
    <linearGradient id="bookCover" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#557767"/>
      <stop offset="100%" stop-color="#6E9482"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="24" fill="url(#deskBg)"/>

  <!-- Open Journal Notebook in center -->
  <g transform="translate(180, 110)">
    <!-- Book Shadow -->
    <rect x="15" y="25" width="410" height="340" rx="16" fill="#D3C7B6" opacity="0.7"/>
    <!-- Hardcover Spine / Background -->
    <rect x="10" y="20" width="420" height="340" rx="14" fill="url(#bookCover)"/>
    <!-- Left Page -->
    <path d="M25,35 L215,35 Q220,180 220,345 L25,345 Q20,190 25,35 Z" fill="#FFFDF9"/>
    <!-- Right Page -->
    <path d="M225,35 L415,35 Q420,190 415,345 L225,345 Q220,180 225,35 Z" fill="#FAF6EE"/>
    
    <!-- Journal Lines & Mindful Writing -->
    <g stroke="#C6DDD0" stroke-width="2" stroke-linecap="round">
      <line x1="50" y1="75" x2="195" y2="75"/>
      <line x1="50" y1="105" x2="195" y2="105"/>
      <line x1="50" y1="135" x2="195" y2="135"/>
      <line x1="50" y1="165" x2="175" y2="165"/>
      <line x1="50" y1="195" x2="195" y2="195"/>
      <line x1="50" y1="225" x2="160" y2="225"/>
      <line x1="50" y1="255" x2="195" y2="255"/>

      <!-- Right page mindful sketch / checklist -->
      <line x1="250" y1="75" x2="390" y2="75"/>
      <line x1="250" y1="105" x2="390" y2="105"/>
      <line x1="250" y1="135" x2="390" y2="135"/>
      <line x1="250" y1="165" x2="350" y2="165"/>
    </g>
    <!-- Little Hand-drawn Heart & Leaf on journal -->
    <path d="M320,240 C320,210 280,210 280,235 C280,260 320,285 320,285 C320,285 360,260 360,235 C360,210 320,210 320,240 Z" fill="#E89A7A" opacity="0.85"/>
    <text x="50" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#5E8271" font-weight="600">TODAY I NOTICED...</text>

    <!-- Fountain Pen -->
    <g transform="translate(440, 90) rotate(18)">
      <rect x="0" y="0" width="14" height="220" rx="7" fill="#3D5A4F"/>
      <path d="M0,220 L7,245 L14,220 Z" fill="#E0A96D"/>
      <line x1="7" y1="220" x2="7" y2="238" stroke="#3D5A4F" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Dried Lavender sprig on corner of desk -->
  <g transform="translate(80, 360) rotate(-25)">
    <line x1="0" y1="100" x2="60" y2="0" stroke="#7C9D8E" stroke-width="2.5"/>
    <ellipse cx="60" cy="5" rx="5" ry="8" fill="#B8A9C9"/>
    <ellipse cx="50" cy="20" rx="5" ry="8" fill="#9B8BB1"/>
    <ellipse cx="40" cy="35" rx="5" ry="8" fill="#B8A9C9"/>
    <ellipse cx="30" cy="50" rx="5" ry="8" fill="#8C79A3"/>
  </g>
</svg>